services:
  db:
    image: postgres:18.0
    container_name: conectatech_db
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ROBERT}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ROBERT1710}
      POSTGRES_DB: ${POSTGRES_DB:-conectatech}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ROBERT} -d $${POSTGRES_DB:-conectatech}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
